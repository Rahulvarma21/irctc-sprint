<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" style="background:#fff; font-family:sans-serif;">
  <rect x="20" y="20" width="560" height="310" rx="5" fill="white" stroke="#ccc"/>
  <!-- Header -->
  <text x="40" y="60" font-size="18" font-weight="bold">Other Preferences</text>
  
  <!-- Vikalp Card -->
  <rect x="40" y="80" width="520" height="150" rx="5" fill="#f0f8ff" stroke="#0056b3"/>
