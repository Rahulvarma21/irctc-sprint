  <text x="60" y="135" font-size="14" fill="#333">Opt into Vikalp to get confirmed tickets on alternate trains.</text>
  <text x="60" y="155" font-size="14" fill="#d9534f" font-weight="bold">Note: Train timing and boarding station may change.</text>
  
  <rect x="60" y="180" width="180" height="30" rx="3" fill="#0056b3"/>
